<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEUB IA Assistant</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">🤖</div>
        <div class="logo-text">CEUB IA</div>
      </div>

      <button class="new-chat-btn" onclick="newChat()">+ Nova Conversa</button>

      <div class="chat-history">
        <div style="padding: 20px; text-align: center; font-size: 12px; color: var(--text-secondary); line-height: 1.8;">
          <div>🔒 Sessão Segura Ativa</div>
          <div style="margin-top: 8px; opacity: 0.7;">FastAPI · RAG · DeepSeek</div>
        </div>
      </div>

      <button class="settings-btn">⚙️ Configurações</button>
    </div>

    <!-- Chat principal -->
    <div class="main-chat">
      <div class="header">
        <div class="header-title">CEUB IA Assistant</div>
        <div class="header-subtitle">
          Classificação por LLM · RAG Semântico · Histórico de Conversa
        </div>
      </div>

      <div class="messages-container" id="messagesContainer">
        <!-- Preenchido pelo JS -->
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="messageInput"
            class="input-field"
            placeholder="Digite sua dúvida… (Enter para enviar, Shift+Enter para nova linha)"
            onkeydown="handleKeyPress(event)"
            rows="1"
          ></textarea>
          <button class="send-btn" onclick="sendMessage()" title="Enviar (Enter)">➤</button>
        </div>
      </div>
    </div>

  </div>

  <script src="/static/js/script.js"></script>
</body>
</html>
