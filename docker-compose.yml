version: '1.0'

services:
  app:
    build: .
    container_name: fastapi-chroma-app
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
      - CHROMA_DB_PATH=/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  chroma_data:
    driver: local